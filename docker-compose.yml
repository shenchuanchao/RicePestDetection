version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    volumes:
      - uploads-data:/app/wwwroot/uploads
      - db-data:/app
    restart: unless-stopped

volumes:
  uploads-data:
  db-data:
